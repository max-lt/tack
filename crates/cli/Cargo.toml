[package]
name = "tack-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tack"
path = "src/main.rs"

[features]
default = ["git", "search", "voice"]
git = ["tack-core/git"]
search = ["tack-core/search"]
voice = ["dep:cpal", "dep:hound"]
crosstalk = ["tack-core/crosstalk"]

[dependencies]
tack-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
ratatui = { version = "0.30", features = ["crossterm"] }
dialoguer = "0.12"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
webbrowser = "1"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls"] }
cpal = { version = "0.18", optional = true }
hound = { version = "3.5", optional = true }
pulldown-cmark = "0.13"
memory-stats = "1.2.0"

[dev-dependencies]
tempfile = "3"
